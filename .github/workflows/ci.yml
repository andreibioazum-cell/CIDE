name: Build Geometrium

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install dependencies
        run: |
          npm ci
          npm install -g cordova
          npm run setup

      - name: Add storage permission
        run: node utils/storage_manager.mjs y

      - name: Build
        run: npm run build paid dev apk

      - name: Package
        run: |
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk Geometrium.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Geometrium
          path: Geometrium.apk
