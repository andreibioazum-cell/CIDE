name: Build CIDE Qt Android

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          host: linux
          target: android
          arch: android_arm64_v8a
          modules: qtwebview
          install-deps: true

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Configure Qt project
        run: |
          cmake \
            -S qt \
            -B qt/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQT_HOST_PATH="$QT_ROOT_DIR" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-26

      - name: Build Android APK
        run: |
          cmake --build qt/build --target CIDEQt_apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CIDE-Qt-Android
          path: qt/build/android-build/*.apk
